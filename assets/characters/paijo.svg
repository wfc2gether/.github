<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Frog Green Gradient -->
    <linearGradient id="frog-skin" x1="60" y1="18" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5D6A7" />
      <stop offset="40%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- Frog Eye Bulge Gradient -->
    <linearGradient id="frog-eye-bulge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E6C9" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>

    <!-- Cream Chin Gradient -->
    <linearGradient id="frog-chin" x1="60" y1="72" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F8E9" />
      <stop offset="100%" stop-color="#DCEDC8" />
    </linearGradient>

    <!-- Sprout Leaf Gradient -->
    <linearGradient id="frog-leaf" x1="60" y1="4" x2="60" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C5E1A5" />
      <stop offset="100%" stop-color="#558B2F" />
    </linearGradient>
  </defs>

  <!-- Tiny Cute Leaf Sprout on Head -->
  <g transform="translate(60 18)">
    <path d="M 0 0 Q -3 -8 -10 -10 Q -4 -16 0 -8 Q 4 -16 10 -10 Q 3 -8 0 0 Z" fill="url(#frog-leaf)" stroke="#1B5E20" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 0 0 L 0 -10" stroke="#1B5E20" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Left Eye Bulb Perch -->
  <circle cx="36" cy="36" r="20" fill="url(#frog-eye-bulge)" stroke="#1B5E20" stroke-width="3" />

  <!-- Right Eye Bulb Perch -->
  <circle cx="84" cy="36" r="20" fill="url(#frog-eye-bulge)" stroke="#1B5E20" stroke-width="3" />

  <!-- Main Head / Body Contour -->
  <path
    d="M 32 40 
       C 22 42 16 54 16 68 
       C 16 84 26 98 42 104 
       C 50 107 70 107 78 104 
       C 94 98 104 84 104 68 
       C 104 54 98 42 88 40 
       C 80 39 40 39 32 40 Z"
    fill="url(#frog-skin)"
    stroke="#1B5E20"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Soft Cream Chin Patch -->
  <path
    d="M 38 78 
       C 38 98 48 104 60 104 
       C 72 104 82 98 82 78 
       C 70 82 50 82 38 78 Z"
    fill="url(#frog-chin)"
  />

  <!-- Kawaii Giant Rosy Cheeks -->
  <ellipse cx="26" cy="74" rx="9" ry="6" fill="#FF8A80" opacity="0.8" />
  <ellipse cx="94" cy="74" rx="9" ry="6" fill="#FF8A80" opacity="0.8" />

  <!-- Left Eye (Big Cute Chibi Eye) -->
  <circle cx="36" cy="36" r="13" fill="#1C311E" />
  <circle cx="33" cy="33" r="5" fill="#FFFFFF" />
  <circle cx="40" cy="40" r="2.2" fill="#FFFFFF" />

  <!-- Right Eye (Big Cute Chibi Eye) -->
  <circle cx="84" cy="36" r="13" fill="#1C311E" />
  <circle cx="81" cy="33" r="5" fill="#FFFFFF" />
  <circle cx="88" cy="40" r="2.2" fill="#FFFFFF" />

  <!-- Nostril Dots -->
  <circle cx="56" cy="62" r="1.4" fill="#1B5E20" />
  <circle cx="64" cy="62" r="1.4" fill="#1B5E20" />

  <!-- Big Cheerful Frog Smile -->
  <path
    d="M 38 72 
       Q 60 90 82 72"
    stroke="#1B5E20"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Dimple ends -->
  <path d="M 36 71 Q 38 74 40 73" stroke="#1B5E20" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 84 71 Q 82 74 80 73" stroke="#1B5E20" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
