<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Floor Tile Frame -->
  <rect x="3" y="3" width="18" height="18" rx="4" fill="#FEF3C7" stroke="#4E342E" stroke-width="1.8" />
  <!-- Parquet grid pattern -->
  <line x1="12" y1="3" x2="12" y2="21" stroke="#D97706" stroke-width="1.5" />
  <line x1="3" y1="12" x2="21" y2="12" stroke="#D97706" stroke-width="1.5" />
  <!-- Grain accents -->
  <line x1="6" y1="6" x2="9" y2="6" stroke="#B45309" stroke-width="1.2" stroke-linecap="round" />
  <line x1="15" y1="15" x2="18" y2="15" stroke="#B45309" stroke-width="1.2" stroke-linecap="round" />
</svg>
