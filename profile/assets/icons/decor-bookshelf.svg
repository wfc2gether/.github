  <path d="M5.5 18V20.5" stroke="#4E342E" stroke-width="1.8" stroke-linecap="round" />
  <!-- Right Wall Mounting Bracket -->
  <path d="M18.5 18V20.5" stroke="#4E342E" stroke-width="1.8" stroke-linecap="round" />

  <!-- Pastel Books -->
  <!-- Mint Book -->
