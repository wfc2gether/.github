  <!-- Mirror Glint / Reflection -->
  <path d="M7 8L9.5 13" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Door: 2 Wood Panels -->
  <rect x="13.5" y="6.5" width="6" height="5.8" rx="0.8" fill="#795548" stroke="#4E342E" stroke-width="1.2" />
  <rect x="13.5" y="14" width="6" height="6" rx="0.8" fill="#795548" stroke="#4E342E" stroke-width="1.2" />

