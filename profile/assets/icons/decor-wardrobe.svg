<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Outer Cabinet Body -->
  <rect x="3" y="2.5" width="18" height="19" rx="2" fill="#8D6E63" stroke="#4E342E" stroke-width="1.8" />
  
  <!-- Top Crown Molding Line -->
  <path d="M3 5H21" stroke="#4E342E" stroke-width="1.5" />
  
  <!-- Center Sliding Door Division -->
  <path d="M12 5V21.5" stroke="#4E342E" stroke-width="1.6" />

