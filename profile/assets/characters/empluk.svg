<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Fluffy Bunny Fur Gradient -->
    <linearGradient id="bunny-fur" x1="60" y1="10" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FFF9F5" />
      <stop offset="100%" stop-color="#F2E6DF" />
    </linearGradient>

    <!-- Inner Ear Pink Gradient -->
    <linearGradient id="bunny-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF80AB" />
      <stop offset="100%" stop-color="#F8BBD0" />
    </linearGradient>

    <!-- Blossom Hairpin Gradient -->
    <linearGradient id="bunny-blossom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>

  <!-- Long Soft Upright Bunny Ears -->
  <!-- Left Ear -->
  <g transform="rotate(-8 36 28)">
    <path
      d="M 28 44 C 18 20 22 4 36 4 C 50 4 50 20 44 44 Z"
      fill="#F2E6DF"
      stroke="#5D4037"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <path
      d="M 32 40 C 26 22 28 9 36 9 C 44 9 44 22 40 40 Z"
      fill="url(#bunny-ear)"
    />
  </g>

  <!-- Right Ear -->
  <g transform="rotate(8 84 28)">
    <path
      d="M 76 44 C 70 20 70 4 84 4 C 98 4 102 20 92 44 Z"
      fill="#F2E6DF"
      stroke="#5D4037"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <path
      d="M 80 40 C 76 22 76 9 84 9 C 92 9 94 22 88 40 Z"
      fill="url(#bunny-ear)"
    />
  </g>

  <!-- Cute Little Daisy / Blossom Hairpin on Right Ear -->
  <g transform="translate(86 38) scale(0.9)">
    <circle cx="-6" cy="0" r="4.5" fill="#FFE082" />
    <circle cx="6" cy="0" r="4.5" fill="#FFE082" />
    <circle cx="0" cy="-6" r="4.5" fill="#FFE082" />
    <circle cx="0" cy="6" r="4.5" fill="#FFE082" />
    <circle cx="0" cy="0" r="5" fill="#FF80AB" stroke="#5D4037" stroke-width="1.4" />
  </g>

  <!-- Head Contour (Extra Fluffy Chubby Cheeks) -->
  <path
    d="M 40 38 
       C 28 40 20 52 18 68 
       C 15 82 16 96 30 103 
       C 40 108 52 108 60 108 
       C 68 108 80 108 90 103 
       C 104 96 105 82 102 68 
       C 100 52 92 40 80 38 
       C 70 36 50 36 40 38 Z"
    fill="url(#bunny-fur)"
    stroke="#5D4037"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Cheek Fluff Tufts -->
  <path d="M 16 80 C 11 84 12 88 17 91" stroke="#5D4037" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 104 80 C 109 84 108 88 103 91" stroke="#5D4037" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Kawaii Rosy Cheeks Blush -->
  <ellipse cx="27" cy="80" rx="8" ry="5.5" fill="#FF80AB" opacity="0.7" />
  <ellipse cx="93" cy="80" rx="8" ry="5.5" fill="#FF80AB" opacity="0.7" />

  <!-- Eyes (Anime Chibi Sparkle Closed Smiles) -->
  <path d="M 38 64 Q 44 58 50 64" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 70 64 Q 76 58 82 64" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Cute Eyelash -->
  <path d="M 49 62 L 52 60" stroke="#3E2723" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 71 62 L 68 60" stroke="#3E2723" stroke-width="1.8" stroke-linecap="round" />

  <!-- Tiny Pink Button Nose -->
  <ellipse cx="60" cy="74" rx="4" ry="3" fill="#FF4081" />

  <!-- Cute Bunny :3 Mouth -->
  <path d="M 54 80 Q 57 85 60 80 Q 63 85 66 80" stroke="#4E342E" stroke-width="2.4" stroke-linecap="round" fill="none" />
</svg>
