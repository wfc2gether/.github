<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Ginger Cat Fur Gradient -->
    <linearGradient id="cat-fur" x1="60" y1="14" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB74D" />
      <stop offset="45%" stop-color="#FB8C00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Inner Ear Pink Gradient -->
    <linearGradient id="cat-inner-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCDD2" />
      <stop offset="100%" stop-color="#F8BBD0" />
    </linearGradient>

    <!-- Cream Muzzle Gradient -->
    <linearGradient id="cat-muzzle" x1="60" y1="62" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
  </defs>

  <!-- EARS (Triangular Pointy Cat Ears) -->
  <!-- Left Ear -->
  <g transform="rotate(-12 34 26)">
    <path
      d="M 20 40 L 32 14 C 34 10 38 10 40 14 L 52 40 Z"
      fill="#E65100"
      stroke="#5D2600"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <path
      d="M 26 38 L 34 19 C 35 17 37 17 38 19 L 46 38 Z"
      fill="url(#cat-inner-ear)"
    />
  </g>

  <!-- Right Ear -->
  <g transform="rotate(12 86 26)">
    <path
      d="M 68 40 L 80 14 C 82 10 86 10 88 14 L 100 40 Z"
      fill="#E65100"
      stroke="#5D2600"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <path
      d="M 74 38 L 82 19 C 83 17 85 17 86 19 L 94 38 Z"
      fill="url(#cat-inner-ear)"
    />
  </g>

  <!-- Head Contour (Chubby Cute Cheeks) -->
  <path
    d="M 40 34 
       C 30 36 22 46 20 62 
       C 17 78 18 94 32 102 
       C 42 108 54 108 60 108 
       C 66 108 78 108 88 102 
       C 102 94 103 78 100 62 
       C 98 46 90 36 80 34 
       C 70 32 50 32 40 34 Z"
    fill="url(#cat-fur)"
    stroke="#5D2600"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Forehead Tabby Stripes -->
  <path d="M 60 35 L 60 48" stroke="#BF360C" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 50 38 L 52 47" stroke="#BF360C" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 70 38 L 68 47" stroke="#BF360C" stroke-width="2.6" stroke-linecap="round" />

  <!-- Cheek Fur Tufts -->
  <path d="M 18 78 C 14 82 14 86 18 89" stroke="#5D2600" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 102 78 C 106 82 106 86 102 89" stroke="#5D2600" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Kawaii Rosy Cheeks Blush -->
  <ellipse cx="28" cy="78" rx="8" ry="5" fill="#FF8A80" opacity="0.8" />
  <ellipse cx="92" cy="78" rx="8" ry="5" fill="#FF8A80" opacity="0.8" />

  <!-- Cream Chubby Muzzle Patch -->
  <ellipse cx="60" cy="80" rx="20" ry="14" fill="url(#cat-muzzle)" />

  <!-- Eyes (Happy Sparkle Anime Closed Smile) -->
  <path d="M 38 62 Q 44 56 50 62" stroke="#3E1700" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 70 62 Q 76 56 82 62" stroke="#3E1700" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyelash accents -->
  <path d="M 50 60 L 53 58" stroke="#3E1700" stroke-width="2" stroke-linecap="round" />
  <path d="M 70 60 L 67 58" stroke="#3E1700" stroke-width="2" stroke-linecap="round" />

  <!-- Cute Pink Triangle Nose -->
  <path d="M 56 72 L 64 72 L 60 76 Z" fill="#E91E63" />

  <!-- Cat Mouth (:3 Cute W-Mouth) -->
  <path d="M 53 79 Q 57 84 60 78 Q 63 84 67 79" stroke="#4E1D00" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Cute Whiskers -->
  <line x1="22" y1="72" x2="36" y2="74" stroke="#6D2C00" stroke-width="1.8" stroke-linecap="round" />
  <line x1="20" y1="80" x2="35" y2="79" stroke="#6D2C00" stroke-width="1.8" stroke-linecap="round" />
  <line x1="98" y1="72" x2="84" y2="74" stroke="#6D2C00" stroke-width="1.8" stroke-linecap="round" />
  <line x1="100" y1="80" x2="85" y2="79" stroke="#6D2C00" stroke-width="1.8" stroke-linecap="round" />
</svg>
